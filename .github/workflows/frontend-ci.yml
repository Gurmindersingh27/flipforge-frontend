name: Frontend CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run snapshot regression tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  browser-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
      - uses: actions/checkout@v4
        with:
          repository: Gurmindersingh27/flipforge-backend
          ref: 784f4cf075162fc85e2efe3b1a241053922f9d5e
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: frontend
      - run: pip install -r backend/requirements.txt
      - name: Browser to API to database regression
        run: node tests/browserFlow.mjs
        working-directory: frontend
        env:
          BACKEND_DIR: ../backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-flow-evidence
          path: frontend/browser-artifacts
